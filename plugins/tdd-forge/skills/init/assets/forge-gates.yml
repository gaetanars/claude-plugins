name: forge-gates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup : toolchain et dépendances de la stack, remplis par /tdd-forge:init (voir references/contract.md)
      # endsetup
      - run: python3 .forge/bin/forge.py gate
